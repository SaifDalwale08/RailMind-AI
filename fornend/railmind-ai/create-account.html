<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Account - RailMind AI</title>
<link rel="icon" href="images/railmind-logo.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#e1e2ed",
                        "on-secondary-fixed": "#141b2b",
                        "on-tertiary-fixed": "#161b29",
                        "on-tertiary-container": "#eef0ff",
                        "surface-dim": "#11131b",
                        "tertiary-container": "#686d7d",
                        "background": "#11131b",
                        "surface": "#11131b",
                        "surface-container-highest": "#32343d",
                        "on-primary-fixed": "#00174b",
                        "primary-fixed": "#dbe1ff",
                        "on-primary": "#002a78",
                        "secondary-fixed-dim": "#c0c6db",
                        "inverse-primary": "#0053db",
                        "on-background": "#e1e2ed",
                        "surface-container": "#1d1f27",
                        "on-secondary-container": "#aeb5c9",
                        "outline": "#8d90a0",
                        "tertiary-fixed": "#dee2f5",
                        "on-tertiary-fixed-variant": "#424656",
                        "on-secondary-fixed-variant": "#404758",
                        "secondary-fixed": "#dce2f7",
                        "outline-variant": "#434655",
                        "surface-tint": "#b4c5ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-secondary": "#293040",
                        "primary": "#b4c5ff",
                        "surface-container-high": "#282a32",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-bright": "#373942",
                        "inverse-surface": "#e1e2ed",
                        "on-surface-variant": "#c3c6d7",
                        "on-primary-container": "#eeefff",
                        "primary-container": "#2563eb",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-fixed-dim": "#c2c6d8",
                        "surface-container-low": "#191b23",
                        "secondary": "#c0c6db",
                        "on-tertiary": "#2b303e",
                        "inverse-on-surface": "#2e3039",
                        "secondary-container": "#404758",
                        "surface-container-lowest": "#0c0e16",
                        "surface-variant": "#32343d",
                        "tertiary": "#c2c6d8",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "base": "4px",
                        "container-padding": "20px",
                        "grid-gutter": "16px",
                        "grid-margin": "24px"
                    },
                    "fontFamily": {
                        "display-sm": ["Poppins", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-sm": ["Poppins", "sans-serif"],
                        "headline-lg": ["Poppins", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],

                    "fontSize": {
                        "display-sm": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],

        }

<link rel="stylesheet" href="create-account.css">
</head>
<body class="bg-[#080D1A] text-on-surface h-screen w-full overflow-hidden flex">
<!-- Left Split - RailMind AI Railway Intelligence -->
<img alt="RailMind AI railway intelligence command center with operators monitoring predictive analytics dashboards" src="images/railmind-ai.png" style="width: 50%; height: 100%; object-fit: cover; object-position: center;">
<!-- Right Split - Registration Form -->
<div style="width: 50%; height: 100%;" class="flex flex-col justify-center items-center p-8 lg:p-24 overflow-y-auto custom-scrollbar">
<div class="w-full max-w-md space-y-8 bg-surface/50 backdrop-blur-xl p-8 rounded-xl border border-outline-variant/20 shadow-2xl relative">
<!-- Form Header -->
<div class="text-center">
<div class="flex justify-center items-center space-x-3 mb-6"><img src="images/railmind-logo.png" alt="RailMind AI Logo" class="auth-logo"></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Your RailMind Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the next generation of railway intelligence.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6 mt-8" id="signup-form" novalidate>
<div class="grid grid-cols-2 gap-4">
<!-- Full Name -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300" id="fullName" name="fullName" placeholder="John Doe" required="" type="text">
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300" id="email" name="email" placeholder="john@railway.com" required="" type="email">
</div>
</div>
<!-- Organization & Role -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="organization">Organization</label>
<input class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300" id="organization" name="organization" placeholder="Metro Corp" required="" type="text">
</div>
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="role">Role</label>
<select class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300 appearance-none" id="role" name="role" required="">
<option disabled="" selected="" value="">Select Role</option>
<option value="operator">Railway Operator</option>
<option value="safety">Safety Manager</option>
<option value="station">Station Manager</option>
<option value="operations">Operations Manager</option>
<option value="admin">Administrator</option>
<option value="other">Other</option>
</select>
</div>
</div>
<!-- Passwords -->
<div class="space-y-4">
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<input class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Password Strength -->
<div class="flex items-center space-x-2 w-full h-1 mt-1">
<div class="h-full bg-error rounded w-1/4"></div>
<div class="h-full bg-surface-variant rounded w-1/4"></div>
<div class="h-full bg-surface-variant rounded w-1/4"></div>
<div class="h-full bg-surface-variant rounded w-1/4"></div>
<span class="ml-2 font-data-mono text-[10px] text-error">Weak</span>
</div>
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-[#080D1A] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md focus:outline-none input-glow transition-all duration-300" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-4">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-white font-headline-sm text-headline-sm py-3 px-4 rounded-lg transition-all duration-200 cinematic-glow flex justify-center items-center group" type="submit">
<span class="">Create Account</span>
<span class="material-symbols-outlined ml-2 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-caps text-[10px]">OR</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full bg-transparent border border-outline-variant/50 hover:border-primary/50 text-on-surface font-headline-sm text-body-md py-3 px-4 rounded-lg transition-all duration-200 flex justify-center items-center" type="button">
<svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</div>
</form>

<p id="signup-error" class="hidden text-center font-body-md text-body-md text-error mt-4" role="alert"></p>
<div id="signup-success" class="hidden absolute inset-0 z-20 flex-col items-center justify-center gap-4 bg-surface/95 backdrop-blur-xl p-8 text-center rounded-xl">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings:'FILL' 1;">check_circle</span>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Account created successfully.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Account created successfully. Sign in to open the dashboard.</p>
<a href="login.html" class="mt-2 bg-primary-container hover:bg-primary-container/90 text-white font-headline-sm text-headline-sm py-3 px-6 rounded-lg transition-all cinematic-glow">Continue to Login</a>
</div>
<div class="text-center mt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-4" href="login.html">Sign In</a>
</p>
</div>
</div>
</div>



<script src="auth.js"></script>
<script src="create-account.js"></script>
</body></html>
