<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>RailMind AI — Secure Login</title>
<meta name="description" content="Sign in to RailMind AI, the railway intelligence platform for live train movement, crowd analytics and predictive risk alerts.">
<link rel="icon" href="images/railmind-logo.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#080D1A",
          "surface": "#11131b",
          "surface-container-lowest": "#080D1A",
          "surface-container-low": "#191b23",
          "surface-container": "#1d1f27",
          "on-surface": "#e1e2ed",
          "on-surface-variant": "#c3c6d7",
          "outline": "#8d90a0",
          "outline-variant": "#434655",
          "primary": "#b4c5ff",
          "primary-container": "#2563eb",
          "on-primary-container": "#ffffff",
          "primary-fixed": "#dbe1ff",
          "primary-fixed-dim": "#b4c5ff",
          "error": "#ffb4ab",
          "success": "#10B981"
        },
        borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
        fontFamily: { display: ["Poppins", "sans-serif"], body: ["Inter", "sans-serif"] }
      }
    }
  }
</script>
<link rel="stylesheet" href="login.css">
</head>
<body class="bg-surface-container-lowest text-on-surface antialiased">
<div class="flex min-h-screen w-full flex-col overflow-x-hidden lg:flex-row">
  <!-- Left: railway control-room visual panel -->
  <div class="relative h-[260px] w-full shrink-0 overflow-hidden border-b border-outline-variant/20 md:h-[300px] lg:h-screen lg:w-[45%] lg:border-b-0 lg:border-r xl:w-1/2">
    <img src="images/railmind-login-control-room.png"
         alt="Railway operations control room with CCTV feeds, train movement data and crowd density analytics"
         class="absolute inset-0 h-full w-full object-cover object-center">
    <div class="absolute inset-0" style="background:linear-gradient(90deg, rgba(3,7,18,0.15) 0%, rgba(3,7,18,0.30) 100%)"></div>
    <div class="absolute bottom-6 left-6 hidden rounded-xl border border-outline-variant/30 bg-surface-container/60 p-5 shadow-2xl backdrop-blur-xl lg:bottom-10 lg:left-10 lg:block">
      <div class="mb-4 flex items-center gap-3">
        <svg class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/></svg>
        <span class="font-body text-[12px] font-semibold uppercase tracking-[0.08em] text-on-surface">System Status</span>
      </div>
      <div class="space-y-3">
        <div class="flex items-center justify-between gap-10 border-b border-outline-variant/20 pb-2">
          <span class="font-body text-[14px] text-on-surface-variant">Active Nodes</span>
          <span class="font-body text-[14px] font-medium text-on-surface">4,892</span>
        </div>
        <div class="flex items-center justify-between gap-10">
          <span class="font-body text-[14px] text-on-surface-variant">Threat Level</span>
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-success shadow-[0_0_8px_#10B981]"></span>
            <span class="font-body text-[14px] font-medium text-success">Safe</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: login form -->
  <div class="relative flex w-full flex-1 items-center justify-center bg-surface-container-lowest p-6 sm:p-12 xl:p-20">
    <div class="pointer-events-none absolute top-1/4 -right-24 h-96 w-96 rounded-full bg-primary/5 blur-3xl"></div>
    <div class="relative z-10 w-full max-w-[440px]">
      <div class="relative overflow-hidden rounded-xl border border-outline-variant/20 bg-surface/40 p-8 shadow-2xl backdrop-blur-2xl sm:p-10">
        <div class="absolute top-0 left-0 h-px w-full bg-gradient-to-r from-transparent via-primary/40 to-transparent"></div>

        <div class="mb-10">
          <div class="mb-6 flex items-center justify-center">
            <img src="images/railmind-logo.png" alt="RailMind AI logo" class="auth-logo">
          </div>
          <h1 class="mb-2 font-display text-[24px] font-semibold text-on-surface">Welcome Back</h1>
          <p class="font-body text-[14px] text-on-surface-variant">Sign in to access your Railway Intelligence Platform.</p>
        </div>

        <form class="space-y-6" id="login-form" novalidate>
          <div class="space-y-1.5">
            <label for="email" class="block font-body text-[12px] font-semibold uppercase tracking-[0.08em] text-on-surface-variant">Email Address</label>
            <div class="relative">
              <input id="email" type="email" placeholder="e.g. name@railway.com"
                     class="w-full rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-4 py-3.5 font-body text-[14px] text-on-surface transition-all placeholder:text-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none">
              <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label for="password" class="block font-body text-[12px] font-semibold uppercase tracking-[0.08em] text-on-surface-variant">Password</label>
              <a href="forgot-password.html" class="font-body text-[13px] text-primary transition-colors hover:text-primary-fixed">Forgot Password?</a>
            </div>
            <div class="relative">
              <input id="password" type="password" placeholder="••••••••"
                     class="w-full rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-4 py-3.5 pr-12 font-body text-[14px] text-on-surface transition-all placeholder:text-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none">
              <button type="button" id="toggle-password" aria-label="Show password"
                      class="absolute right-3 top-1/2 flex -translate-y-1/2 items-center justify-center rounded-md p-1 text-on-surface-variant/70 transition-colors hover:bg-surface-container hover:text-on-surface">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 3 18 18"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="flex items-center pt-2">
            <input id="remember" type="checkbox" class="h-4 w-4 cursor-pointer appearance-none rounded border border-outline-variant/50 bg-surface-container-lowest transition-all checked:border-primary-container checked:bg-primary-container focus:ring-2 focus:ring-primary/30 focus:outline-none">
            <label for="remember" class="ml-3 cursor-pointer select-none font-body text-[14px] text-on-surface-variant">Remember me</label>
          </div>

          <p id="login-error" class="hidden font-body text-[13px] text-error" role="alert"></p>

          <div class="pt-2">
            <button type="submit" class="w-full rounded-lg border border-transparent bg-primary-container py-3.5 font-display text-[15px] font-semibold text-on-primary-container transition-all duration-300 hover:shadow-[0_0_12px_rgba(37,99,235,0.4)] active:scale-[0.98]">Sign In</button>
          </div>
        </form>

        <div class="mt-8 mb-8 flex items-center">
          <div class="flex-grow border-t border-outline-variant/30"></div>
          <span class="px-4 font-body text-[11px] font-semibold uppercase tracking-widest text-on-surface-variant">OR</span>
          <div class="flex-grow border-t border-outline-variant/30"></div>
        </div>

        <button type="button" id="google-btn" class="flex w-full items-center justify-center gap-3 rounded-lg border border-outline-variant/40 bg-transparent py-3 font-body text-[14px] font-medium text-on-surface transition-colors duration-200 hover:border-outline-variant hover:bg-surface-container">
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="mt-8 border-t border-outline-variant/10 pt-6 text-center">
          <p class="font-body text-[14px] text-on-surface-variant">Don't have an account?
            <a href="create-account.html" class="ml-1 font-medium text-primary transition-colors hover:text-primary-fixed-dim">Create Account</a>
          </p>
        </div>
      </div>

      <div class="mt-8 flex items-center justify-center gap-2 font-body text-[11px] uppercase tracking-wide text-on-surface-variant/60">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
        Secure access to RailMind AI operational intelligence.
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
