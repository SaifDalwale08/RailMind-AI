<body class="bg-[#080D1A] min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Full-screen railway intelligence background -->
<img src="images/railmind-bg.png" alt="RailMind AI railway intelligence control room" class="bg-railway">
<div class="bg-overlay"></div>
<!-- Centered Card -->
<main class="relative z-10 w-full max-w-[460px] px-grid-margin py-8">

<div class="glass-panel rounded-xl shadow-2xl p-8 flex flex-col gap-8 relative overflow-hidden">
<!-- Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<!-- Header -->
<div class="text-center flex flex-col items-center gap-4">
<div class="flex items-center justify-center h-10 mb-2">
    <img src="images/railmind-logo.png" alt="RailMind AI Logo" class="auth-logo">
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Forgot Your Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                    Enter your registered email address and we'll send you instructions to reset your password.
                </p>
</div>
<!-- Interactive Form Area -->
<div class="transition-opacity duration-300" id="form-container">
<form class="flex flex-col gap-6" id="reset-form">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-background border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-data-mono text-data-mono text-on-surface placeholder:text-outline/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-[inset_0_1px_2px_rgba(0,0,0,0.3)]" id="email" placeholder="operative@railmind.ai" required="" type="email">
</div>
</div>
<p id="reset-error" class="hidden font-body-md text-body-md text-error" role="alert"></p>
<button class="w-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-lg py-3 flex items-center justify-center gap-2 primary-glow transition-all active:scale-[0.98] border border-primary/30" type="submit">
<span class="">Send Reset Link</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Success State (Hidden initially) -->
<div class="hidden flex-col items-center gap-4 py-4 text-center opacity-0 transition-opacity duration-500" id="success-state">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center border border-primary/30 relative">
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping"></div>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Password reset request processed.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Your password reset request has been recorded. You can return to sign in and continue.
                </p>
</div>
<!-- Footer Action -->
<div class="pt-2 border-t border-outline-variant/30 text-center">
<a class="inline-flex items-center gap-2 font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors py-2" href="login.html">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    BACK TO SIGN IN
                </a>
</div>
</div>
</main>
<script src="auth.js"></script>
<script src="forgot-password.js"></script>
</body></html>
